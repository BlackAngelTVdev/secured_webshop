<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Shop - Administration</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
    <div id="topbar"></div>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Administration</h1>
                <p class="hero-text">Gestion des utilisateurs</p>
            </div>
        </section>

        <section class="admin-section">
            <div class="container">
                <h2>Liste des utilisateurs</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Rôle</th>
                            <th>Etat</th>
                            <th>Adresse</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <tr><td colspan="7">Chargement...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer id="contact" class="footer">
        <div class="container">
            <p>Projet pédagogique - ETML 183</p>
        </div>
    </footer>

    <script src="/js/nav.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        const auth = window.SecureShopAuth;

        (async () => {
            if (!auth.requireAuth('/login')) {
                return;
            }

            const response = await auth.authFetch('/api/admin/users');

            if (response.status === 401) {
                window.location.href = '/login';
                return;
            }

            if (response.status === 403) {
                window.location.href = '/';
                return;
            }

            if (!response.ok) {
                document.getElementById('user-table-body').innerHTML =
                    '<tr><td colspan="5">Impossible de charger les utilisateurs</td></tr>';
                return;
            }

            const users = await response.json();
            if (!Array.isArray(users)) {
                document.getElementById('user-table-body').innerHTML =
                    '<tr><td colspan="7">Acces refuse</td></tr>';
                return;
            }

            const tbody = document.getElementById('user-table-body');
            tbody.innerHTML = users.map(u => `
                <tr>
                    <td>${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td><span class="badge-${u.role}">${u.role}</span></td>
                    <td>${Number(u.account_locked) === 1 ? 'Verrouille' : 'Actif'}</td>
                    <td>${u.address || '-'}</td>
                    <td>
                        ${Number(u.account_locked) === 1 ? `<button type="button" class="unlock-user-btn" data-user-id="${u.id}">Debloquer</button>` : '-'}
                    </td>
                </tr>
            `).join('');

            document.querySelectorAll('.unlock-user-btn').forEach((button) => {
                button.addEventListener('click', async () => {
                    const userId = button.getAttribute('data-user-id');
                    button.disabled = true;
                    button.textContent = 'Deblocage...';

                    try {
                        const unlockResponse = await auth.authFetch(`/api/admin/users/${userId}/unlock`, {
                            method: 'POST'
                        });

                        if (!unlockResponse.ok) {
                            throw new Error('Deblocage impossible');
                        }

                        window.location.reload();
                    } catch (_error) {
                        button.disabled = false;
                        button.textContent = 'Debloquer';
                        alert('Impossible de debloquer ce compte.');
                    }
                });
            });
        })().catch(() => {
            document.getElementById('user-table-body').innerHTML =
                '<tr><td colspan="7">Acces refuse ou session invalide</td></tr>';
        });
    </script>
</body>
</html>
